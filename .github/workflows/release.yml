name: Release (npm alpha)

# Owner-triggered only. Publishes the current checkout to the npm `alpha` dist-tag with provenance
# via npm Trusted Publishing (OIDC) — configure the trusted publisher for
# @whatasoda/agent-delegator on npmjs.com before the first run; no npm token is stored.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run package:smoke
      - run: npm publish --provenance
